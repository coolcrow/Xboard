name: Docker Build and Publish

on:
  push:
    branches: ["master", "dev"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, bcmath, pcntl, redis, zip, gmp
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Update version in app.php
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          echo "Updated version to: $VERSION"

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_MULTI_PLATFORM=1
            CACHEBUST=${{ github.sha }}
            REPO_URL=https://github.com/${{ github.repository }}
            BRANCH_NAME=${{ github.ref_name }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host


  bundle:
    # 合一镜像：面板 + 自研主题（单一部署制品，容器重建自愈）
    # master push 自动构建（合并即发版）；dev 分支或手动 Dispatch 均可触发
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bundle image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bundle
          push: true
          platforms: linux/amd64,linux/arm64
          secrets: |
            webtoken=${{ secrets.XBOARD_WEB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/coolcrow/xboard:bundle
            ${{ env.REGISTRY }}/coolcrow/xboard:bundle-${{ github.sha }}
          provenance: false
          allow: |
            network.host

  offline-tarball:
    # 离线安装包：bundle 镜像 + deploy 脚本 → tar.gz（中国客户不联网可装）
    # master push 自动构建；tag 触发时附到 Release
    runs-on: ubuntu-latest
    needs: bundle
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull bundle image (amd64)
        run: docker pull --platform linux/amd64 ghcr.io/coolcrow/xboard:bundle

      - name: Build offline package
        run: |
          mkdir -p dist
          # 镜像导出（仅 amd64，控制包体积）
          docker save ghcr.io/coolcrow/xboard:bundle | gzip -6 > dist/image-bundle.tar.gz

          # 部署脚本 + 文档
          cp deploy/install.sh deploy/upgrade.sh deploy/uninstall.sh deploy/compose.prod.yaml dist/
          cp docs/QUICKSTART.md dist/

          # 离线包 README
          cat > dist/README-offline.md <<'EOF'
          # AIBolt 离线安装包

          ## 使用方法

          1. 解压此包到任意目录
          2. 解压镜像包: `gunzip image-bundle.tar.gz && mv image-bundle.tar image-bundle.tar`（或 install.sh 自动检测 .tar.gz）
          3. 运行安装: `sudo bash install.sh --image ghcr.io/coolcrow/xboard:bundle`

          install.sh 检测到当前目录有 `image-bundle.tar` 时自动走离线模式（docker load），无需联网。

          ## 包内容

          | 文件 | 说明 |
          |---|---|
          | image-bundle.tar.gz | Docker 镜像（面板+主题，amd64） |
          | install.sh | 一键安装脚本 |
          | upgrade.sh | 升级脚本 |
          | uninstall.sh | 卸载脚本 |
          | compose.prod.yaml | 生产 compose 模板 |
          | QUICKSTART.md | 快速开始文档 |
          EOF

          # 打总包
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          tar czf aibolt-offline-${VERSION:-latest}-amd64.tar.gz -C dist .
          sha256sum aibolt-offline-*.tar.gz > SHA256SUMS
          ls -lh aibolt-offline-*

      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aibolt-offline-*.tar.gz
            SHA256SUMS

      - name: Upload artifact (master push)
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: aibolt-offline-${{ github.sha }}
          path: |
            aibolt-offline-*.tar.gz
            SHA256SUMS
          retention-days: 30
