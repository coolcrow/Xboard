name: Package Visibility

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: 'Target visibility for ghcr.io/coolcrow/xboard'
        required: true
        default: 'private'
        type: choice
        options: [private, public]

jobs:
  flip:
    name: "Set visibility → ${{ inputs.visibility }}"
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Change package visibility
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/xboard/visibility" \
            -d "{\"visibility\":\"${{ inputs.visibility }}\"}")
          cat resp.json || true
          echo "HTTP $code"
          [ "$code" = "204" ] || { echo "::error::visibility PATCH failed"; exit 1; }
